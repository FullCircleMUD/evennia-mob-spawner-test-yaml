# Millholm zone — synthetic spawn rules for mob-spawner integration tests.
# Field shape per architecture.md "Rule schema (v0)". rule_id is unique
# within this file; typeclass paths are placeholders (Tier 3 resolution
# is the consumer's concern at ms_load time, not part of this fixture).

rules:
  # Base wolves — common, fast respawn measured from spawn time.
  # Bare-string tag demonstrates the shorthand untyped form.
  - rule_id: 1
    typeclass: typeclasses.test_mobs.Wolf
    key: a grey wolf
    area_tag: woods_wolves
    target: 6
    max_per_room: 1
    respawn_seconds: 120
    tags:
      - predator

  # "Fat" wolves — share key/desc with base wolves, different loot.
  # Demonstrates the indistinguishable-variant pattern from
  # architecture.md decision #9. Carries the same predator flag PLUS
  # a categorised gameplay-role tag.
  - rule_id: 2
    typeclass: typeclasses.test_mobs.WolfFat
    key: a grey wolf
    area_tag: woods_wolves
    target: 2
    max_per_room: 1
    respawn_seconds: 120
    tags:
      - predator
      - {key: rare_drop, category: gameplay_role}

  # Kobold chieftain — single-room spawning. Its area is
  # kobold_warren_den, which only the den room carries, so the chieftain
  # always spawns there. Cooldown counts from kill time
  # (death_cooldown_seconds), not from last spawn. Per-spawn state reset
  # lives on the typeclass as ms_at_post_spawn(). Tag pair demonstrates
  # both untyped-via-dict and categorised forms.
  - rule_id: 3
    typeclass: typeclasses.test_mobs.KoboldChieftain
    key: the Kobold Chieftain
    area_tag: kobold_warren_den
    target: 1
    max_per_room: 1
    death_cooldown_seconds: 1800
    tags:
      - {key: boss}
      - {key: kobold_leader, category: gameplay_role}

  # Kobolds — plain area spawning across both warren rooms, the den
  # included.
  - rule_id: 4
    typeclass: typeclasses.test_mobs.Kobold
    key: a kobold
    area_tag: kobold_warren
    target: 5
    max_per_room: 3
    respawn_seconds: 60
    tags:
      - minion

  # Boar sounder — pack spawning, in the three boar_thicket rooms. Both
  # rules share the pack key, so a new boar spawns in a room where a
  # living member already is — the tusker or another boar — and the
  # whole sounder ends up together. Placed at random, five boars would
  # scatter across the three rooms.
  - rule_id: 5
    typeclass: typeclasses.test_mobs.Boar
    key: an old tusker
    area_tag: boar_thicket
    pack: boar_sounder
    target: 1
    max_per_room: 1
    respawn_seconds: 120

  - rule_id: 6
    typeclass: typeclasses.test_mobs.Boar
    key: a wild boar
    area_tag: boar_thicket
    pack: boar_sounder
    target: 4
    max_per_room: 4
    respawn_seconds: 30
